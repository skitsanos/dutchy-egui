[package]
name = "dutchy-egui"
version = "1.0.26"
edition = "2024"
rust-version = "1.95"
description = "Dutchy Design System for egui: sharp geometry, warm colors, and bold typography"
license = "MIT"
repository = "https://github.com/skitsanos/dutchy-egui"
readme = "README.md"
keywords = ["egui", "gui", "design-system", "widgets", "theme"]
categories = ["gui"]
include = [
    "/src/**", "/assets/**", "/examples/**", "/tests/**", "/docs/**",
    "/scripts/prepare_fonts.py", "/.clippy.toml", "/AGENTS.md", "/README.md",
    "/LICENSE", "/THIRD_PARTY.md", "/CHANGELOG.md", "/Cargo.lock",
    "!/tests/snapshots/**/*.diff.png", "!/tests/snapshots/**/*.new.png",
    "!/tests/snapshots/**/*.old.png",
]

[features]
default = ["bundled-fonts", "markdown"]
bundled-fonts = []
markdown = ["dep:pulldown-cmark"]
url-images = ["dep:ehttp", "dep:image", "image/jpeg", "image/png"]
png-export = ["dep:image", "image/png"]

[dependencies]
egui = "0.37.0"
ehttp = { version = "0.7.3", optional = true, default-features = false, features = ["streaming"] }
image = { version = "0.25.10", optional = true, default-features = false }
pulldown-cmark = { version = "0.13.6", optional = true, default-features = false }

[dev-dependencies]
rfd = "0.18.0"
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "glow", "wayland", "x11"] }
egui_kittest = { version = "0.37.0", features = ["eframe", "snapshot", "wgpu"] }

[[example]]
name = "showcase"
path = "examples/showcase/main.rs"
required-features = ["bundled-fonts"]

[[example]]
name = "dutchy_todo"
path = "examples/dutchy_todo/main.rs"
required-features = ["bundled-fonts"]
test = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
cognitive_complexity = "warn"
